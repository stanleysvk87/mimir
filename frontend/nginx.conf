server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # AI endpoints (recall/digest/handoff) call out to an AI provider
        # and can legitimately take longer than nginx's 60s default,
        # especially /projects/{id}/handoff with a large timeline -- raised
        # 2026-08-16 after a real 504 on a handoff request.
        proxy_read_timeout 180s;
    }

    # SPA fallback -- client-side routing (react-router) owns everything
    # that isn't /api or a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
